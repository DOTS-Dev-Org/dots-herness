name: Desktop tests

on:
  push:
    paths:
      - "shared/**"
      - "windows/**"
      - "linux/**"
      - "macos/**"
      - "mobile/**"
      - "tools/sync_prompts.py"
      - "tools/check_localization.py"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    paths:
      - "shared/**"
      - "windows/**"
      - "linux/**"
      - "macos/**"
      - "mobile/**"
      - "tools/sync_prompts.py"
      - "tools/check_localization.py"
      - ".github/workflows/desktop-tests.yml"

permissions:
  contents: read

jobs:
  prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every platform prompt literal matches shared/prompts
        run: python3 tools/sync_prompts.py --check
      - name: Every desktop locale has the canonical key set
        run: python3 tools/check_localization.py --check

  test:
    needs: prompts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            directory: linux/DotsHarness
            command: dotnet test DotsHarness.sln
          - os: windows-latest
            directory: windows/DotsHarness
            command: dotnet test DotsHarness.sln
          - os: macos-14
            directory: macos/DotsHarness
            command: swift test --disable-sandbox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        if: matrix.os != 'macos-14'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Test desktop target
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
